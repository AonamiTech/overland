<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FBFAF8"/>

  <!-- brand lockup -->
  <g transform="translate(80,74)">
    <rect width="42" height="42" rx="9" fill="#0E32E8"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(21,21) scale(1.28) translate(-16,-16)">
      <circle cx="16" cy="16" r="9.4"/>
      <path d="M7.4 18c2-3 4.7-3 7 0s5 3 7 0"/>
    </g>
    <text x="58" y="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#14161A">Overland</text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="250" font-family="'Courier New', monospace" font-size="19" letter-spacing="4" fill="#0E32E8">REAL-TIME FREIGHT EXCHANGE</text>

  <!-- headline -->
  <text x="78" y="330" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="78" fill="#14161A">The freight market,</text>
  <text x="78" y="418" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-style="italic" font-size="78" fill="#1F3FD1">priced in the open.</text>

  <!-- footer strip -->
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#E7E3DC" stroke-width="1.5"/>
  <text x="80" y="548" font-family="'Courier New', monospace" font-size="22" fill="#14161A">2,400+ carriers</text>
  <text x="360" y="548" font-family="'Courier New', monospace" font-size="22" fill="#14161A">$18.4M cleared / mo</text>
  <text x="720" y="548" font-family="'Courier New', monospace" font-size="22" fill="#14161A">48-state coverage</text>

  <!-- index chip (top right) -->
  <g transform="translate(820,86)">
    <rect width="300" height="112" rx="16" fill="#FFFFFF" stroke="#E7E3DC" stroke-width="1.5"/>
    <text x="22" y="34" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#8B857C">DRY VAN INDEX</text>
    <text x="22" y="82" font-family="'Courier New', monospace" font-weight="700" font-size="40" fill="#14161A">$2.42</text>
    <text x="150" y="82" font-family="'Courier New', monospace" font-size="16" fill="#8B857C">/mi</text>
    <text x="242" y="34" font-family="'Courier New', monospace" font-size="15" fill="#0F7A4A">+2.5%</text>
    <path d="M212 92 L232 84 L252 88 L272 74" fill="none" stroke="#1F3FD1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
